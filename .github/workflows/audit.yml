# Shadow-mode audit: every 15 min, check CWA E-A0015-004 for a new
# significant-earthquake waveform package; if new, download it, run the
# EdgeQuake engine replay blind, and commit the audit record back to the
# repo — a public, self-accumulating verification log.
#
# Setup (one-time):
#   1. repo Settings -> Secrets and variables -> Actions ->
#      New repository secret:  CWA_API_KEY = CWA-xxxx...
#   2. Settings -> Actions -> General -> Workflow permissions ->
#      "Read and write permissions" (so the workflow can push results)
#   3. make sure outputs/phasenet_cwa_ft.pt is committed
#      (check: git ls-files outputs/phasenet_cwa_ft.pt)
name: shadow-audit

on:
  schedule:
    - cron: "*/15 * * * *"   # UTC; CWA waveform arrives ~12 min after origin
  workflow_dispatch: {}       # manual run button for testing

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest waveform record
        id: check
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          curl -sf "https://opendata.cwa.gov.tw/api/v1/rest/datastore/E-A0015-004?Authorization=${CWA_API_KEY}&format=JSON" -o latest.json
          ID=$(python3 -c "import json; print(json.load(open('latest.json'))['cwaopendata']['identifier'])")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -f "outputs/audit_archive/done_$ID" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "no new event ($ID already audited)"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "NEW event: $ID"
          fi

      - name: Set up Python
        if: steps.check.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU)
        if: steps.check.outputs.new == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas obspy seisbench

      - name: Run engine audit
        if: steps.check.outputs.new == 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python scripts/ingest_cwa_wave.py --fetch --audit 2>&1 | tee audit_log.txt

      - name: Commit audit record
        if: steps.check.outputs.new == 'true'
        run: |
          mkdir -p outputs/audit_archive
          touch "outputs/audit_archive/done_${{ steps.check.outputs.id }}"
          cp audit_log.txt "outputs/audit_archive/audit_${{ steps.check.outputs.id }}.txt"
          git config user.name  "edgequake-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/replay_eq*.json outputs/audit_archive/
          git commit -m "shadow audit: ${{ steps.check.outputs.id }}" || exit 0
          git pull --rebase origin main
          git push
