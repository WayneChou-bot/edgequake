# Shadow-mode audit: every 15 min, check CWA E-A0015-004 for a new
# significant-earthquake waveform package; if new, download it, run a
# post-hoc arrival-time replay (times are lower bounds), regenerate the
# results manifest, VERIFY it, and only then commit — the workflow can
# never push a repo state that fails its own integrity checks.
#
# Setup (one-time):
#   1. repo Settings -> Secrets and variables -> Actions ->
#      New repository secret:  CWA_API_KEY = CWA-xxxx...
#   2. Settings -> Actions -> General -> Workflow permissions ->
#      "Read and write permissions" (so the workflow can push results)
#   3. make sure outputs/phasenet_cwa_ft.pt is committed
#      (check: git ls-files outputs/phasenet_cwa_ft.pt)
name: shadow-audit

on:
  schedule:
    - cron: "*/15 * * * *"   # UTC; CWA waveform release cadence is irregular (observed ~12 min once)
  workflow_dispatch: {}       # manual run button for testing

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest waveform record
        id: check
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          CWA_API_KEY=$(echo -n "$CWA_API_KEY" | tr -d '[:space:]')
          if [ -z "$CWA_API_KEY" ]; then
            echo "::error::CWA_API_KEY secret 未設定"; exit 1
          fi
          code=$(curl -sL -o latest.json -w "%{http_code}" \
            "https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/E-A0015-004?Authorization=${CWA_API_KEY}&downloadType=WEB&format=JSON")
          echo "CWA fileapi HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::CWA fileapi 回應 $code"; exit 1
          fi
          ID=$(python3 -c "import json; print(json.load(open('latest.json'))['cwaopendata']['identifier'])")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -f "outputs/audit_archive/done_$ID" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "no new event ($ID already audited)"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "NEW event: $ID"
          fi

      - name: Set up Python
        if: steps.check.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (pinned, CPU)
        if: steps.check.outputs.new == 'true'
        run: |
          # torch pin comes from the lockfile but installs from the CPU index
          pip install "$(grep '^torch==' requirements-lock.txt)" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock.txt

      - name: Run engine audit
        if: steps.check.outputs.new == 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python scripts/ingest_cwa_wave.py --fetch --audit 2>&1 | tee audit_log.txt

      - name: Archive raw log + done marker
        if: steps.check.outputs.new == 'true'
        run: |
          mkdir -p outputs/audit_archive
          touch "outputs/audit_archive/done_${{ steps.check.outputs.id }}"
          cp audit_log.txt "outputs/audit_archive/audit_${{ steps.check.outputs.id }}.txt"

      - name: LLM event report
        if: steps.check.outputs.new == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/llm_report.py

      - name: Build audit index
        if: steps.check.outputs.new == 'true'
        run: python scripts/build_audit_index.py

      - name: Rebuild results manifest (pins + cross-checks new artifacts)
        if: steps.check.outputs.new == 'true'
        run: python scripts/build_results_summary.py

      - name: Verify manifest before publishing
        if: steps.check.outputs.new == 'true'
        run: python scripts/build_results_summary.py --verify

      - name: Commit audit record
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name  "edgequake-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/replay_eq*.json outputs/audit_archive/ \
            docs/audit.json vercel/audit.json outputs/results_summary.json
          git commit -m "shadow audit: ${{ steps.check.outputs.id }}" || exit 0
          git pull --rebase origin main
          # round-9: re-verify ON the rebased tree — if new code was
          # pushed mid-run, the ancestor check fails here and nothing is
          # pushed; the unpushed done-marker means the next scheduled
          # run redoes the audit cleanly on the new base
          python scripts/build_results_summary.py --verify
          git push

      - name: Notify audit result
        if: steps.check.outputs.new == 'true'
        env:
          EQ_WEBHOOK_URL: ${{ secrets.EQ_WEBHOOK_URL }}
          EQ_WEBHOOK_TOKEN: ${{ secrets.EQ_WEBHOOK_TOKEN }}
          EVENT_ID: ${{ steps.check.outputs.id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          url = (os.environ["EQ_WEBHOOK_URL"] + "?token="
                 + urllib.parse.quote(os.environ["EQ_WEBHOOK_TOKEN"]))
          body = open("audit_log.txt", encoding="utf-8").read()[-1500:]
          data = json.dumps({
              "subject": "EdgeQuake 稽核完成: " + os.environ["EVENT_ID"],
              "body": body}).encode()
          req = urllib.request.Request(
              url, data=data, headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=20).read()[:80])
          PYEOF